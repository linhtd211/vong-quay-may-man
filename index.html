<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f3f9ff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Vòng quay"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>Vòng quay</title><link rel="stylesheet" href="style.css?v=4"></head><body><main class="app"><header><button id="resetBtn" class="iconBtn" aria-label="Đặt lại">↻</button><h1>Vòng quay</h1><button id="addBtnTop" class="iconBtn" aria-label="Thêm">＋</button></header><section class="wheelArea"><div class="wheelWrap"><div class="pointer"></div><canvas id="wheel" width="700" height="700"></canvas></div><button id="spinBtn">▶ QUAY</button></section><button id="manageBtn" class="manageBar"><span><b id="count">0</b> nội dung</span><span>Quản lý <b>⌃</b></span></button></main>
<div id="manageModal" class="modal hidden"><div class="sheet manageSheet"><div class="grab"></div><div class="sheetHead"><h2>Danh sách nội dung (<span id="sheetCount">0</span>)</h2><button data-close="manageModal">✕</button></div><div id="items" class="items"></div><button id="addBtn" class="primary">＋ Thêm nội dung</button></div></div>
<div id="addModal" class="modal hidden"><div class="sheet"><div class="grab"></div><div class="sheetHead"><h2>Thêm nội dung</h2><button data-close="addModal">✕</button></div><textarea id="bulkInput" placeholder="Nhập nội dung, mỗi dòng một mục..."></textarea><button id="confirmAdd" class="primary">＋ Thêm vào vòng quay</button><p class="hint">Có thể nhập hoặc dán nhiều dòng. Mỗi dòng là một nội dung.</p></div></div>
<div id="resultModal" class="modal hidden"><div class="resultCard"><button class="closeResult" data-close="resultModal">✕</button><div class="trophy">🏆</div><div class="chosen">ĐÃ CHỌN</div><div id="resultText" class="resultText"></div><button id="againBtn" class="primary pink">↻ QUAY LẠI</button><button id="removeWinnerBtn" class="secondary">🗑 XÓA KHỎI VÒNG</button></div></div><script src="app.js?v=4"></script></body></html>
